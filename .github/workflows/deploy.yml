name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Statik site derle
        env:
          GITHUB_PAGES: "true"
          # Bu iki değer herkese açık (publishable) anahtarlardır; güvenlik RLS ile sağlanır.
          NEXT_PUBLIC_SUPABASE_URL: https://hxrseluvqsbbhzjptsuw.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_CTtQorACCiq1MW6FCMbYYw_wqIEkqU2
          NEXT_PUBLIC_SITE_URL: https://srcshop1.github.io/Cpmsatis
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
